name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORT: 4173
      BASE_PATH: /
      VITE_SUPABASE_URL: https://eqyzswhxjzzzwtwnenur.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm run build
      - name: Run Bee Runtime unit tests
        run: pnpm --filter @workspace/scripts run test:bee-runtime
      - name: Run classic DHO access query tests
        run: pnpm --filter @workspace/scripts run test:classic-dho-access
      - name: Run local SQL migrations and RLS suites
        run: bash scripts/test-sql.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - name: Archive deployable preview
        uses: actions/upload-artifact@v4
        with:
          name: youb-netlify-preview
          path: artifacts/mockup-sandbox/dist
          if-no-files-found: error

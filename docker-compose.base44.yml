services:
  web:
    image: node:24-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    environment:
      - PORT=5173
      - BASE_PATH=/
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install -g pnpm@9 && (pnpm install --frozen-lockfile || pnpm install) && pnpm --filter @workspace/mockup-sandbox run dev"
